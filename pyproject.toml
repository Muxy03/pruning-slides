[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pruning-slides"
version = "0.1.0"
description = "Prune intermediate build slides from PDF slide decks"
requires-python = ">=3.9"
dependencies = ["pypdf>=5.0", "fonttools>=4.0"]

[project.scripts]
prune-slides = "pruning_slides.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["pruning_slides*"]
